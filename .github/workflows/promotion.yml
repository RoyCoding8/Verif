name: Check promotion model

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

jobs:
  promotion-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Check the fenced model and its negative control
        working-directory: verification
        run: |
          curl --fail --location --retry 3 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  $RUNNER_TEMP/tla2tools.jar" | sha1sum --check -
          java -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC -workers 1 -deadlock -config Promotion.cfg Promotion.tla
          java -cp "$RUNNER_TEMP/tla2tools.jar" tla2sany.SANY PromotionInductive.tla
          if java -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC -workers 1 -deadlock -config PromotionUnfenced.cfg Promotion.tla > "$RUNNER_TEMP/unfenced.log" 2>&1; then
            cat "$RUNNER_TEMP/unfenced.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/unfenced.log"
          grep --fixed-strings 'Invariant AuthorizedUpdateInvariant is violated.' "$RUNNER_TEMP/unfenced.log"
      - name: Check competing promotions and stale evidence
        working-directory: verification
        run: |
          java -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC -workers 1 -deadlock -config PromotionFreshness.cfg PromotionFreshness.tla
          if java -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC -workers 1 -deadlock -config PromotionFreshnessStaleEvidence.cfg PromotionFreshness.tla > "$RUNNER_TEMP/stale-evidence.log" 2>&1; then
            cat "$RUNNER_TEMP/stale-evidence.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/stale-evidence.log"
          grep --fixed-strings 'Invariant FreshAuthorizedWrites is violated.' "$RUNNER_TEMP/stale-evidence.log"

  promotion-inductive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Install pinned Apalache
        run: |
          archive="$RUNNER_TEMP/apalache-0.63.0.tgz"
          curl --fail --location --retry 3 https://github.com/apalache-mc/apalache/releases/download/v0.63.0/apalache-0.63.0.tgz --output "$archive"
          echo "a756e96af249bf33cd7629667a49472cb26ac8227c48583da139b414834d59df  $archive" | sha256sum --check -
          mkdir "$RUNNER_TEMP/apalache"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/apalache" --strip-components=1
          echo "$RUNNER_TEMP/apalache/bin" >> "$GITHUB_PATH"
      - name: Check initiation, preservation, and safety
        working-directory: verification
        run: |
          apalache-mc check --out-dir="$RUNNER_TEMP/inductive-init" --init=Init --inv=IndInv --length=0 PromotionInductive.tla
          apalache-mc check --out-dir="$RUNNER_TEMP/inductive-step" --init=IndInv --inv=IndInv --length=1 PromotionInductive.tla
          apalache-mc check --out-dir="$RUNNER_TEMP/inductive-safety" --init=IndInv --inv=Safety --length=0 PromotionInductive.tla
      - name: Require a reachable authorized write
        working-directory: verification
        run: |
          status=0
          apalache-mc check --out-dir="$RUNNER_TEMP/inductive-write" --init=Init --inv=NoWrite --length=2 PromotionInductive.tla > "$RUNNER_TEMP/inductive-write.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/inductive-write.log"
          test "$status" -eq 12
          grep --extended-regexp 'State 2: state invariant [0-9]+ violated' "$RUNNER_TEMP/inductive-write.log"
      - name: Require a stale-evidence counterexample
        working-directory: verification
        run: |
          out="$RUNNER_TEMP/inductive-mutant"
          status=0
          apalache-mc check --out-dir="$out" --init=Init --next=UnsafeNext --inv=Safety --length=3 PromotionInductive.tla > "$RUNNER_TEMP/inductive-mutant.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/inductive-mutant.log"
          test "$status" -eq 12
          grep --extended-regexp 'State 3: state invariant [0-9]+ violated' "$RUNNER_TEMP/inductive-mutant.log"
          shopt -s nullglob
          traces=("$out"/PromotionInductive.tla/*/violation1.itf.json)
          test "${#traces[@]}" -eq 1
          test -s "${traces[0]}"
