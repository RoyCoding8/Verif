<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verity</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="nav-toggle" type="button" aria-label="Toggle threads">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="brand">
      <span class="mark" aria-hidden="true">V</span>
      <span class="wordmark">Verity</span>
    </div>
    <div class="topbar-spacer"></div>
    <span class="route-status" id="route-status">
      <span class="dot dot-queued" id="route-dot" aria-hidden="true"></span>
      <span id="route-label">Checking…</span>
    </span>
    <button class="icon-btn" id="inspector-toggle" type="button" aria-label="Toggle inspector">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 4v16" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h13M21 17h-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="12" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="19" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-inner">
        <button class="btn-primary btn-block" id="new-task" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          New task
        </button>

        <div class="side-group">
          <div class="side-label">Projects</div>
          <button class="project-row" id="project-row" type="button">
            <span class="project-name">Reservation demo</span>
            <span class="project-meta mono">demo</span>
          </button>
        </div>

        <div class="side-group grow">
          <div class="side-label">Threads</div>
          <div class="thread-list" id="thread-list" aria-label="Threads"></div>
        </div>

        <div class="side-foot">
          <span class="mono" id="host"></span>
        </div>
      </div>
    </aside>

    <main class="center" id="center">
      <section class="thread-view" id="thread-view" aria-label="Chat">
        <header class="thread-head">
          <div class="thread-head-text">
            <h1 class="thread-title" id="thread-title">New task</h1>
            <div class="thread-sub mono" id="thread-sub"></div>
          </div>
          <span class="chip chip-idle" id="thread-status">Idle</span>
        </header>
        <div class="chat-scroll">
          <div class="transcript" id="transcript" role="log" aria-live="polite" aria-label="Messages"></div>
        </div>
        <footer class="composer">
          <div class="composer-field">
            <label class="visually-hidden" for="goal">Goal</label>
            <textarea id="goal" rows="1" placeholder="Describe the task"></textarea>
          </div>
          <div class="composer-row">
            <div class="field">
              <label class="visually-hidden" for="task">Task</label>
              <select id="task" aria-label="Task"></select>
            </div>
            <div class="field field-mode">
              <label class="visually-hidden" for="mode">Mode</label>
              <select id="mode" aria-label="Mode">
                <option value="fixture">Demo</option>
                <option value="pi">Pi</option>
              </select>
            </div>
            <p class="mode-note" id="mode-note" hidden></p>
            <div class="composer-spacer"></div>
            <button class="btn-primary btn-run" id="send" type="button">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span id="send-label">Run</span>
            </button>
          </div>
        </footer>
      </section>

      </section>
    </main>

    <aside class="context" id="context" aria-label="Inspector">
      <div class="ctx-details" id="ctx-details">
      <div class="ctx-inner">
        <section class="ctx-section">
          <h2 class="ctx-heading">Details</h2>
          <div class="ctx-rows" id="ctx-rows"></div>
        </section>

        <section class="ctx-section" id="ctx-results-block" hidden>
          <h2 class="side-label">Results</h2>
          <div class="ctx-results" id="ctx-results"></div>
        </section>

        <section class="ctx-section">
          <h2 class="side-label">Changed files</h2>
          <div class="file-list" id="file-list"></div>
          <form class="file-open" id="file-form">
            <label class="visually-hidden" for="file-path">Open a file by path</label>
            <input class="mono" id="file-path" placeholder="File path" autocomplete="off" spellcheck="false">
            <button class="btn-quiet" type="submit">Open</button>
          </form>
        </section>
      </div>
      </div>

      <section class="file-view" id="file-view" hidden aria-label="File">
        <header class="file-head">
          <button class="btn-quiet file-back" id="file-close" type="button" aria-label="Back to details">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Back
          </button>
          <span class="mono file-name" id="file-name"></span>
        </header>
        <pre class="file-content" id="file-content" tabindex="0"></pre>
      </section>
    </aside>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-heading">
    <form method="dialog" class="settings-form">
      <header class="settings-head">
        <h2 id="settings-heading">Settings</h2>
        <button class="icon-btn" id="settings-close" type="submit" aria-label="Close settings">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="settings-field">
        <span class="settings-label" id="appearance-label">Appearance</span>
        <div class="segmented" role="group" aria-labelledby="appearance-label">
          <button type="button" id="theme-light">Light</button>
          <button type="button" id="theme-dark">Dark</button>
          <button type="button" id="theme-system">System</button>
        </div>
      </div>
    </form>
  </dialog>
</div>
<script src="app.js"></script>
</body>
</html>
